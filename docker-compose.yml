services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carsdb
      POSTGRES_USER: craigdeals
      POSTGRES_PASSWORD: craigdeals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craigdeals -d carsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: craigdeals:local
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    image: craigdeals:local
    ports:
      - "8080:5000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # docker compose run --rm scraper
  scraper:
    image: craigdeals:local
    command: python -m src.scraper
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

  # docker compose run --rm pricer
  pricer:
    image: craigdeals:local
    command: python -m src.pricer real
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

volumes:
  postgres_data:
